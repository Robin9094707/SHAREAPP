name: Suite bauen und testen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Server und Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_server.py
      - name: Einzeldatei prüfen
        run: |
          python -m py_compile dist/RobinsShare-Server.py
          python dist/RobinsShare-Server.py --help
          python scripts/check_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-Server
          path: dist/RobinsShare-Server.py
          if-no-files-found: error
  ios:
    name: iOS und IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Xcode-Projekt erstellen
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Kleine native Tests
        timeout-minutes: 15
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key,group in d["devices"].items() if "iOS-26" in key for x in group if "iPhone" in x["name"]))')
          xcodebuild test -project ios/RobinShare.xcodeproj -scheme RobinShare -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Geräte-App archivieren und unsignierte IPA packen
        run: |
          xcodebuild archive -project ios/RobinShare.xcodeproj -scheme RobinShare -configuration Release -destination 'generic/platform=iOS' -archivePath build/RobinShare.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa/Payload dist
          cp -R build/RobinShare.xcarchive/Products/Applications/RobinShare.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../../dist/RobinsShare-iOS-unsigniert.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-iOS
          path: dist/RobinsShare-iOS-unsigniert.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iOS-Testdiagnose
          path: TestResults.xcresult
  windows:
    name: Windows und Setup-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native Anwendung bauen
        run: dotnet build windows/RobinShare/RobinShare.csproj -c Release
      - name: Kleine native Tests
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process windows/RobinShare/bin/Release/net10.0-windows10.0.19041.0/win-x64/RobinsShare.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP/RobinsShare-test-error.txt" -ErrorAction SilentlyContinue; exit 1 }
      - name: Eigenständige EXE veröffentlichen
        run: dotnet publish windows/RobinShare/RobinShare.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Installationsprogramm erstellen
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-Windows
          path: dist/RobinsShare-Windows-Setup.exe
          if-no-files-found: error
  release:
    name: Drei Downloads bereitstellen
    if: github.event_name != 'pull_request'
    needs: [server, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum RobinsShare-* > SHA256SUMS.txt
          gh release create "v1.0.${{ github.run_number }}" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Robins Share Suite 1.0 · Build ${{ github.run_number }}" --notes 'Deutsche Weboberfläche und Server auf Port 5055, native iOS-App und natives Windows-11-Programm. Die IPA ist unsigniert und muss vor Installation mit einer passenden Apple-Signatur versehen werden. Siehe README für Einrichtung, lokale Kopplung und Plattformgrenzen.' RobinsShare-Server.py RobinsShare-iOS-unsigniert.ipa RobinsShare-Windows-Setup.exe SHA256SUMS.txt
