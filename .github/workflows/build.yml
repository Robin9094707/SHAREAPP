name: Suite bauen und testen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    name: Server und Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_server.py
      - name: Einzeldatei prüfen
        run: |
          python -m py_compile dist/RobinsShare-Server.py
          python dist/RobinsShare-Server.py --help
          python scripts/check_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-Server
          path: dist/RobinsShare-Server.py
          if-no-files-found: error
  ios:
    name: iOS und IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Xcode-Projekt erstellen
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Kleine native Swift-Tests
        timeout-minutes: 3
        run: swift test --package-path ios
      - name: iOS-Simulator für Picker-Regression starten
        timeout-minutes: 5
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=json.load(sys.stdin)["runtimes"]; print(next(x["identifier"] for x in r if x.get("isAvailable") and "iOS-26-0" in x["identifier"]))')
          DEVICE=$(xcrun simctl create RobinShare-Regression com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")
          echo "REGRESSION_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Native Picker- und Import-Regressionstests
        timeout-minutes: 6
        run: |
          xcodebuild test -project ios/RobinShare.xcodeproj -scheme RobinShare -destination "platform=iOS Simulator,id=$REGRESSION_DEVICE" -parallel-testing-enabled NO -resultBundlePath NativeRegression.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=''
      - name: Geräte-App archivieren und unsignierte IPA packen
        run: |
          xcodebuild archive -project ios/RobinShare.xcodeproj -scheme RobinShare -configuration Release -destination 'generic/platform=iOS' -archivePath build/RobinShare.xcarchive CODE_SIGNING_ALLOWED=NO
          mkdir -p build/ipa/Payload dist
          cp -R build/RobinShare.xcarchive/Products/Applications/RobinShare.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../../dist/RobinsShare-iOS-unsigniert.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-iOS
          path: dist/RobinsShare-iOS-unsigniert.ipa
          if-no-files-found: error
  windows:
    name: Windows und Setup-EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native Anwendung bauen
        run: dotnet build windows/RobinShare/RobinShare.csproj -c Release
      - name: Kleine native Tests
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process windows/RobinShare/bin/Release/net10.0-windows10.0.19041.0/win-x64/RobinsShare.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP/RobinsShare-test-error.txt" -ErrorAction SilentlyContinue; exit 1 }
      - name: Eigenständige EXE veröffentlichen
        run: dotnet publish windows/RobinShare/RobinShare.csproj -c Release -r win-x64 --self-contained true -o dist/windows
      - name: Installationsprogramm erstellen
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installiertes Programm bis zum sichtbaren Fenster starten
        timeout-minutes: 2
        shell: pwsh
        run: ./scripts/test_windows_install.ps1 -Installer dist/RobinsShare-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RobinsShare-Windows
          path: dist/RobinsShare-Windows-Setup.exe
          if-no-files-found: error
  release:
    name: Drei Downloads bereitstellen
    if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip release]')
    needs: [server, ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum RobinsShare-* > SHA256SUMS.txt
          gh release create "v1.0.${{ github.run_number }}" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Robins Share Suite 1.0.1 · Build ${{ github.run_number }}" --notes 'App-Version 1.0.1: Windows-Startfehler durch unverträgliches Icon behoben; Start des installierten Programms geprüft. iOS-Dateiauswahl mit koordiniertem Hintergrundimport und nativen Regressionstests überarbeitet. Server auf Port 5055 bleibt kompatibel. Die IPA ist unsigniert und muss vor Installation mit einer passenden Apple-Signatur versehen werden. Siehe README für Einrichtung, lokale Kopplung und Plattformgrenzen.' RobinsShare-Server.py RobinsShare-iOS-unsigniert.ipa RobinsShare-Windows-Setup.exe SHA256SUMS.txt
