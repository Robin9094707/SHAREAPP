name: RobinShare
options:
  bundleIdPrefix: eu.rjuhas
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '3'
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  RobinShare:
    type: application
    platform: iOS
    sources: [RobinShare, Shared]
    dependencies:
      - target: RobinShareLiveActivity
        embed: true
    info:
      path: RobinShare/Info.plist
      properties:
        CFBundleDisplayName: Robins Share
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Robins Share findet deinen Windows-PC im lokalen Netzwerk und überträgt Dateien direkt.
        NSBonjourServices: ['_robinshare._tcp']
        NSBluetoothAlwaysUsageDescription: Bluetooth erkennt PCs mit Robins Share in deiner Nähe. Dateien werden über das lokale Netzwerk übertragen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.robinshare
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_MAIN_PROFILE_UUID)
    scheme:
      testTargets: [RobinShareTests]
  RobinShareLiveActivity:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared]
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Robins Share Transfers
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.robinshare.liveactivity
        APPLICATION_EXTENSION_API_ONLY: YES
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_WIDGET_PROFILE_UUID)
        GENERATE_INFOPLIST_FILE: YES
  RobinShareTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RobinShareTests]
    dependencies: [{target: RobinShare}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
